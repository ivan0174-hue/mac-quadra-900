# QuadraPi - impostazioni (modificabili anche dal menu con F12)
# Una riga per voce: "parola valore". Le righe con # sono commenti.
#
# Dischi rigidi: una riga "disk" per ogni immagine (max 4 dal menu)
# disk SD:/quadra/hd/System753.img
#
ramsize 67108864
cpuspeed 0
screen win/640/480
displaycolordepth 8
soundout 0
volume 80
mousespeed 100
swap_opt_cmd true
